<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoE2 Market — Runes of Aldur</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
/* ── Тема ──
   Тёмная по умолчанию, светлая включается кнопкой в шапке (запоминается в localStorage).
   Все цвета — через переменные; акцент раздела = цвет текста его заголовка (currentColor). */
:root {
  color-scheme: dark;
  --bg: #0d1020;       --surface: #151a2e;  --surface-2: #1a2036;  --raised: #222a46;
  --line: #2b3354;     --line-soft: #212843;
  --text: #ebe6d8;     --muted: #a3a9c4;    --faint: #7e86a6;
  --gold: #d8b45f;     --gold-hi: #f2cf79;
  --flip: #f3a950;     --flip-bg: rgba(243,169,80,.12);
  --gain: #62d19a;     --gain-bg: rgba(98,209,154,.12);
  --buy:  #7cb0ff;     --buy-bg:  rgba(124,176,255,.12);
  --craft:#b69cff;     --craft-bg:rgba(182,156,255,.12);
  --uniq: #ef9a5d;     --uniq-bg: rgba(239,154,93,.12);
  --pc:   #4fd1c5;     --pc-bg:   rgba(79,209,197,.12);
  --loss: #ff7a7a;     --loss-bg: rgba(255,122,122,.12);
  --on-accent: #0d1020;
  --grid: rgba(255,255,255,.025);
  --hdr-bg: #090c19;   --hdr-text: #ebe6d8;
  --font-ui: 'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;
  --font-serif: 'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1eee6;       --surface: #ffffff;  --surface-2: #faf8f3;  --raised: #f3f0e7;
  --line: #d9d4c6;     --line-soft: #ebe7dc;
  --text: #1c1f33;     --muted: #565b75;    --faint: #6b7089;
  --gold: #8a6a12;     --gold-hi: #a67c0a;
  --flip: #b45309;     --flip-bg: rgba(180,83,9,.09);
  --gain: #15803d;     --gain-bg: rgba(21,128,61,.09);
  --buy:  #1d4ed8;     --buy-bg:  rgba(29,78,216,.08);
  --craft:#6d28d9;     --craft-bg:rgba(109,40,217,.08);
  --uniq: #c2410c;     --uniq-bg: rgba(194,65,12,.08);
  --pc:   #0f766e;     --pc-bg:   rgba(15,118,110,.09);
  --loss: #c62828;     --loss-bg: rgba(198,40,40,.08);
  --on-accent: #ffffff;
  --grid: rgba(28,31,51,.035);
  --hdr-bg: #141a33;   --hdr-text: #ebe6d8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-color: var(--line) transparent; }
body {
  font-family: var(--font-ui); font-size: 13px; line-height: 1.4;
  background-color: var(--bg); color: var(--text);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px;
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
button { font-family: inherit; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ── Шапка ── */
.header {
  background: var(--hdr-bg); color: var(--hdr-text); padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid #d8b45f;
  box-shadow: 0 1px 0 #00000055;
}
.header-title { font-family: var(--font-serif); font-size: 18px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; display: flex; align-items: center; gap: 9px; }
/* табличка лиги — как заголовок предмета в игре: рамка, засечки, ромбики по краям */
.header-title span {
  color: #f2cf79; font-size: 15px; padding: 1px 12px; border: 1px solid #d8b45f; border-radius: 3px;
  background: linear-gradient(180deg, #d8b45f1f, #d8b45f0a);
  display: inline-flex; align-items: center; gap: 8px;
}
.header-title span::before, .header-title span::after { content: '◆'; font-size: 7px; color: #d8b45f; opacity: .8; }
#updated { color: var(--hdr-text); opacity: .62; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.divine-rate-label { font-size: 11px; color: #a3a9c4; white-space: nowrap; }
.divine-rate { color: #f2cf79; font-weight: 600; }
.budget-wrap { display: flex; align-items: center; gap: 6px; background: #ffffff0d; border: 1px solid #d8b45f3d; border-radius: 5px; padding: 3px 10px; }
.budget-wrap label { font-size: 12px; color: #d8b45f; white-space: nowrap; }
.budget-input { width: 65px; background: transparent; border: none; outline: none; color: #f2cf79; font-weight: 700; font-size: 13px; text-align: right; font-family: inherit; }
.budget-input::placeholder { color: #f2cf7955; }
.budget-unit { font-size: 11px; color: #d8b45f; }
.btn-refresh { background: #d8b45f1f; border: 1px solid #d8b45f55; color: #f2cf79; padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 11px; transition: background .15s; white-space: nowrap; }
.btn-refresh:hover { background: #d8b45f3d; }
.profile-sel { background: transparent; color: #f2cf79; border: none; outline: none; font-size: 12px; font-weight: 600; max-width: 110px; font-family: inherit; }
.profile-sel option { background: #151a2e; color: #f2cf79; }

.loading { text-align: center; padding: 60px 20px; color: var(--muted); }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: var(--loss-bg); border: 1px solid var(--loss); color: var(--loss); padding: 12px 16px; border-radius: 6px; margin: 16px; line-height: 1.5; }
.error-msg code { color: var(--text); background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

.content { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

/* ── Hinekora's Lock ── */
.hineroka-block { background: var(--surface); border: 1px solid var(--gold); border-radius: 8px; padding: 13px 14px; color: var(--text); }
.hineroka-block h2 { color: var(--gold-hi); font-family: var(--font-serif); font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.hineroka-block h2 img { width: 22px; height: 22px; image-rendering: pixelated; }
.hineroka-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; align-items: start; }
.hst .label { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
.hst .value { font-size: 19px; font-weight: 700; color: var(--gold-hi); }
.hst .sub { font-size: 11px; color: var(--gold); margin-top: 2px; }
.chg-up { color: var(--gain); font-size: 11px; }
.chg-dn { color: var(--loss); font-size: 11px; }
.verdict-badge { padding: 7px 12px; border-radius: 6px; font-weight: 700; font-size: 13px; text-align: center; }
.verdict-hold { background: var(--gain-bg); border: 1px solid var(--gain); color: var(--gain); }
.verdict-sell { background: var(--flip-bg); border: 1px solid var(--flip); color: var(--flip); }
.verdict-sub { font-size: 10px; color: var(--faint); margin-top: 4px; }
.hineroka-chart-wrap { height: 105px; margin-top: 10px; position: relative; }

/* ── Панели ── */
.cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .cards-row { grid-template-columns: 1fr; } .hineroka-grid { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
/* верхняя кромка = цвет раздела (currentColor заголовка): так видно тип панели ещё до чтения названия */
.card-header {
  padding: 9px 14px; font-family: var(--font-serif); font-weight: 600; font-size: 14px; letter-spacing: .01em;
  display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  box-shadow: inset 0 2px 0 currentColor; color: var(--gold);
}
.card-header.flip   { background: var(--flip-bg); color: var(--flip); }
.card-header.invest { background: var(--gain-bg); color: var(--gain); }
.card-header.rates  { background: var(--buy-bg);  color: var(--buy); }
.badge { font-family: var(--font-ui); font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-left: auto; font-weight: 700; color: var(--on-accent); }
.badge-flip   { background: var(--flip); }
.badge-invest { background: var(--gain); }
.badge-rates  { background: var(--buy); }

/* ── Вкладки категорий ── */
.cat-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); background: var(--surface-2); }
.cat-tab { padding: 3px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--muted); transition: border-color .15s, color .15s; white-space: nowrap; font-family: inherit; }
.cat-tab:hover { border-color: var(--faint); color: var(--text); }
.cat-tab.active-flip   { background: var(--flip); border-color: var(--flip); color: var(--on-accent); font-weight: 700; }
.cat-tab.active-invest { background: var(--gain); border-color: var(--gain); color: var(--on-accent); font-weight: 700; }

/* ── Таблицы ── */
table { width: 100%; border-collapse: collapse; }
th { padding: 6px 6px; text-align: left; font-size: 11px; font-weight: 600; color: var(--faint); background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 6px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--raised); }
.item-name { font-weight: 600; font-size: 12px; color: var(--text); }
.item-cat  { font-size: 10px; color: var(--faint); }
.price-now  { font-weight: 700; color: var(--text); font-size: 12px; white-space: nowrap; }
.bid-buy    { color: var(--buy); font-weight: 700; font-size: 12px; }
.bid-sell   { color: var(--gain); font-weight: 700; font-size: 12px; }
.bid-sub    { font-size: 10px; color: var(--faint); }
.margin-good { color: var(--gain); font-weight: 700; font-size: 12px; }
.margin-ok   { color: var(--flip); font-weight: 700; font-size: 12px; }
.margin-low  { color: var(--faint); font-size: 12px; }
.entry-good  { color: var(--gain); font-size: 11px; font-weight: 600; }
.entry-ok    { color: var(--flip); font-size: 11px; }
.entry-bad   { color: var(--loss); font-size: 11px; }
.units-badge { background: var(--buy-bg); color: var(--buy); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.trend-up   { color: var(--gain); font-weight: 600; font-size: 11px; }
.trend-down { color: var(--loss); font-weight: 600; font-size: 11px; }
.trend-flat { color: var(--faint); font-size: 11px; }
.rank { color: var(--faint); font-size: 11px; font-weight: 600; }
.rank.top3 { color: var(--gold-hi); }
.liq-low { color: var(--loss); font-size: 10px; }

.rates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.rate-item { padding: 8px 11px; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); }
.rate-item .r-name { font-size: 11px; color: var(--muted); margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rate-item .r-val   { font-size: 14px; font-weight: 700; color: var(--buy); }
.rate-item .r-change { font-size: 10px; }
.no-data { padding: 14px; color: var(--faint); text-align: center; font-size: 12px; }

/* ── Портфель ── */
.portfolio-block { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
.portfolio-block .card-header { background: #d8b45f14; color: var(--gold-hi); }
.pf-split { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); background: var(--surface-2); flex-wrap: wrap; }
.pf-split label { font-size: 11px; color: var(--muted); }
.pf-slider { width: 120px; accent-color: var(--gold); }
.cur-btn { padding: 2px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: inherit; }
.cur-btn:hover { border-color: var(--faint); color: var(--text); }
.cur-btn.active { background: var(--gold); border-color: var(--gold); color: var(--on-accent); font-weight: 700; }
.grid-warn { color: var(--flip); font-size: 10px; }
.pf-flip-lbl  { color: var(--flip); font-weight: 700; font-size: 11px; }
.pf-invest-lbl { color: var(--gain); font-weight: 700; font-size: 11px; }
.pf-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
@media (max-width: 760px) { .pf-cols { grid-template-columns: 1fr; } }
.pf-col { border-right: 1px solid var(--line-soft); }
.pf-col:last-child { border-right: none; }
.pf-col-hdr { padding: 6px 14px; font-size: 11px; font-weight: 700; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
.pf-col-hdr.flip-hdr   { background: var(--flip-bg); color: var(--flip); }
.pf-col-hdr.invest-hdr { background: var(--gain-bg); color: var(--gain); }
.pf-total { font-size: 11px; font-weight: 400; color: var(--faint); }
.pf-total span { font-weight: 700; }
.pf-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--line-soft); }
.pf-row:last-child { border-bottom: none; }
.pf-num { font-size: 11px; color: var(--gold); font-weight: 700; min-width: 16px; }
.pf-info { flex: 1; min-width: 0; }
.pf-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-detail { font-size: 10px; color: var(--faint); margin-top: 1px; }
.pf-alloc { text-align: right; min-width: 80px; }
.pf-alloc .qty { font-size: 13px; font-weight: 700; color: var(--text); }
.pf-alloc .cost { font-size: 10px; color: var(--faint); }
.pf-alloc .profit { font-size: 11px; font-weight: 700; }
.pf-profit-good { color: var(--gain); }
.pf-profit-ok   { color: var(--flip); }
.pf-summary { display: flex; gap: 16px; padding: 8px 14px; background: var(--surface-2); border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.pf-summary-item { font-size: 11px; color: var(--muted); }
.pf-summary-item span { font-weight: 700; color: var(--text); }
.pf-no-budget { padding: 20px; text-align: center; color: var(--faint); font-size: 12px; }

/* ── Сворачиваемые секции ── */
.coll-chev { margin-right: 5px; color: inherit; opacity: .6; font-size: 11px; }
.card-header.coll { cursor: pointer; user-select: none; }
.card-header.coll:hover { filter: brightness(1.12); }

/* ── Главные вкладки ── */
.main-tabs { display: flex; gap: 4px; padding: 12px 14px 0; border-bottom: 1px solid var(--line); margin: 0 0 -1px; flex-wrap: wrap; }
.main-tab { padding: 7px 16px; border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; }
.main-tab:hover { color: var(--text); background: var(--surface-2); }
.main-tab.active { background: var(--surface); color: var(--gold-hi); border-color: var(--line); box-shadow: inset 0 2px 0 var(--gold); position: relative; top: 1px; }

/* ── Price check ── */
.pc-form { display: flex; gap: 8px; padding: 10px 14px; align-items: flex-start; border-bottom: 1px solid var(--line-soft); background: var(--surface-2); flex-wrap: wrap; }
.pc-form textarea { flex: 1; min-width: 260px; height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; resize: vertical; background: var(--bg); color: var(--text); outline: none; }
.pc-form textarea:focus { border-color: var(--pc); }
.pc-res { padding: 12px 14px; }
.pc-prices { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0; }
.pc-price-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.pc-price-box .lbl { font-size: 11px; color: var(--faint); }
.pc-price-box .val { font-size: 15px; font-weight: 700; color: var(--text); }
.pc-reason { font-size: 12px; color: var(--muted); padding: 2px 0; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--text); }
.verdict-neutral { background: #9e9e9e22; border: 1px solid var(--faint); color: var(--muted); }

/* ── Журнал сделок ── */
.tracker-block { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
.tracker-block .card-header { background: var(--craft-bg); color: var(--craft); }
.tr-form { display: flex; gap: 6px; padding: 9px 14px; border-bottom: 1px solid var(--line-soft); background: var(--surface-2); flex-wrap: wrap; align-items: center; }
.tr-form select, .tr-form input { padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; background: var(--bg); color: var(--text); outline: none; font-family: inherit; }
.tr-form select:focus, .tr-form input:focus { border-color: var(--craft); }
.tr-item-inp { flex: 1; min-width: 160px; }
.tr-btn { background: var(--craft); color: var(--on-accent); border: none; padding: 5px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 700; }
.tr-btn:hover { filter: brightness(1.1); }
.tr-err { color: var(--loss); font-size: 11px; }
.tr-side-buy  { color: var(--buy); font-weight: 700; }
.tr-side-sell { color: var(--gain); font-weight: 700; }
.tr-del { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 13px; padding: 0 4px; }
.tr-del:hover { color: var(--loss); }
.pnl-pos { color: var(--gain); font-weight: 700; }
.pnl-neg { color: var(--loss); font-weight: 700; }
.pnl-na  { color: var(--faint); }

/* ── Крафт-арбитраж ── */
.craft-block { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
.craft-block .card-header { background: var(--craft-bg); color: var(--craft); }
.craft-note { font-size: 11px; color: var(--faint); padding: 6px 14px; border-bottom: 1px solid var(--line-soft); background: var(--surface-2); }
.headroom-good { color: var(--gain); font-weight: 700; font-size: 12px; }
.headroom-ok   { color: var(--flip); font-weight: 700; font-size: 12px; }
.headroom-low  { color: var(--faint); font-size: 12px; }
.badge-craft { background: var(--craft); }

/* ── Уникальные ── */
.uniq-block .card-header { background: var(--uniq-bg); color: var(--uniq); }
.cat-tab.active-uniq { background: var(--uniq); border-color: var(--uniq); color: var(--on-accent); font-weight: 700; }
.uniq-icon { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
/* единый стиль иконок предметов: object-fit:contain не искажает неквадратные иконки PoE2 */
.item-ico { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; vertical-align: middle; }
.item-ico-ph { display:inline-flex; align-items:center; justify-content:center; background: var(--surface-2); border:1px dashed var(--line); border-radius:4px; color: var(--faint); font-size:11px; box-sizing:border-box; }
.name-with-ico { display: flex; align-items: center; gap: 7px; min-width: 0; }
.name-with-ico > div { min-width: 0; }
.uniq-name { font-weight: 700; font-size: 12px; color: var(--uniq); }
.uniq-base { font-size: 10px; color: var(--faint); }

<script>
/* ── Тема: dark по умолчанию, выбор хранится в localStorage ── */
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888'; }
function syncThemeBtn() {
  const b = document.getElementById('theme-btn'); if (!b) return;
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  b.textContent = dark ? '☀' : '☾';
  b.title = dark ? 'Включить светлую тему' : 'Включить тёмную тему';
}
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('poe2_theme', next); } catch (e) {}
  syncThemeBtn();
  if (typeof pcxCurrent !== 'undefined' && pcxCurrent && document.getElementById('pcx-canvas')) drawPcxChart(pcxCurrent);
}
document.addEventListener('DOMContentLoaded', syncThemeBtn);

<script>
// Реалмы poe2scout. nativeApi — в чём API реально отдаёт CurrentPrice (менять нельзя, это факт API).
// baseApi — рабочая валюта расчётов/бюджета (её МОЖНО менять); если она не совпадает с nativeApi,
// весь датасет один раз пересчитывается при загрузке (см. rebaseToWorkUnit). midApi — вторая, справочная.
const REALMS = {
  poe2: { game:'PoE 2', emoji:'⚔️', nativeApi:'exalted', baseApi:'chaos',   baseSh:'c',  midApi:'exalted', midSh:'ex' },
  pc:   { game:'PoE 1', emoji:'🏛️', nativeApi:'chaos',   baseApi:'chaos',   baseSh:'c',  midApi:'exalted', midSh:'ex' },
};
let REALM  = localStorage.getItem('poe2_realm') || 'poe2';
if (!REALMS[REALM]) REALM = 'poe2';
let LEAGUE = localStorage.getItem('poe2_league_' + REALM) || (REALM === 'poe2' ? 'Runes of Aldur' : 'Mirage');
let U_BASE  = REALMS[REALM].baseSh;   // подпись базовой единицы
let U_MID   = REALMS[REALM].midSh;    // подпись второй единицы
let MID_API = REALMS[REALM].midApi;
let leaguesCache = {};
let usingSnapshot = null; // {savedAt} когда данные показаны из локального кэша data.json, а не с живого API
let divinePrice = 8.6;    // base-валюта за 1 Divine Orb (дефолт по факту пересчитан после первой загрузки)
let chaosPrice  = 0.04;   // base-валюта за 1 MID-валюту (имя историческое: toC/fmtC работают через неё)
let allValidItems = [];
let allUniques    = []; // уникальные предметы всех категорий (отдельный раздел + Price Check)
let marketByText  = {}; // Text -> item (валюта + уникалы, для автоподстановки, рыночной цены и Price Check)
let flipCat   = 'all';
let investCat = 'all';
let uniqCat   = 'weapon'; // активная вкладка раздела уникалов

// Эмодзи по ApiId категории (poe2 + poe1); неизвестные → 📦.
const CAT_EMOJI = {
  currency:'💰', fragments:'🧩', runes:'🪬', lineagesupportgems:'💠', essences:'🧪',
  ultimatum:'🔮', breach:'🌀', delirium:'🌫️', ritual:'🩸', abyss:'🦴', incursion:'🏛️',
  expedition:'⛏️', vaultkeys:'🗝️', uncutgems:'💎', idol:'🗿', vaal:'🐉', verisium:'🪙',
  djinncoins:'🪄', keepers:'👹', allflameembers:'🔥', runegrafts:'🪬', ancestor:'🪶',
  deliriumorbs:'🌫️', catalysts:'⚗️', oils:'🛢️', delve:'🦴', cards:'🃏',
  weapon:'⚔️', armour:'🛡️', accessory:'💍', jewel:'🔷', flask:'⚗️', map:'🗺️', sanctum:'🏺',
};
function catLabel(apiId, label) { return (CAT_EMOJI[apiId] || '📦') + ' ' + (label || apiId); }
// Строятся динамически из категорий выбранного реалма (см. buildCategories).
let CAT_LABELS    = { all: '🗂️ Все' };  // валютные категории + 'all'
let UNIQUE_CATS   = {};                  // unique-категории (пусто = нет уникалов, как в PoE1)
let CURRENCY_CATS = [];                  // порядок ApiId валютных категорий реалма

function buildCategories(resp) {
  CAT_LABELS = { all: '🗂️ Все' };
  CURRENCY_CATS = [];
  (resp && resp.CurrencyCategories || []).forEach(c => {
    CAT_LABELS[c.ApiId] = catLabel(c.ApiId, c.Label);
    CURRENCY_CATS.push(c.ApiId);
  });
  UNIQUE_CATS = {};
  (resp && resp.UniqueCategories || []).forEach(c => { UNIQUE_CATS[c.ApiId] = catLabel(c.ApiId, c.Label); });
  // активная вкладка уникалов — первая доступная
  const uks = Object.keys(UNIQUE_CATS);
  if (!uks.includes(uniqCat)) uniqCat = uks[0] || 'weapon';
}

const budgetEl   = document.getElementById('budget');
const budgetExEl = document.getElementById('budget-ex');
const budgetCEl  = document.getElementById('budget-c');
const BUDGET_KEYS = [[budgetEl,'poe2_budget'],[budgetExEl,'poe2_budget_ex'],[budgetCEl,'poe2_budget_c']];
BUDGET_KEYS.forEach(([el, key]) => {
  el.value = localStorage.getItem(key) || '';
  el.addEventListener('input', () => {
    localStorage.setItem(key, el.value);
    renderTables();
    renderPortfolio();
  });
});
/* ── Профили: отдельный стеш и журнал сделок на каждый ── */
function getProfiles() {
  try { const p = JSON.parse(localStorage.getItem('poe2_profiles') || 'null'); return Array.isArray(p) && p.length ? p : ['основной']; }
  catch { return ['основной']; }
}
function saveProfiles(p) { localStorage.setItem('poe2_profiles', JSON.stringify(p)); }
let activeProfile = localStorage.getItem('poe2_profile_active') || 'основной';
// миграция данных, записанных до появления профилей
if (!localStorage.getItem('poe2_profiles')) {
  saveProfiles(['основной']);
  const oldT = localStorage.getItem('poe2_trades');
  const oldS = localStorage.getItem('poe2_stash');
  if (oldT && !localStorage.getItem('poe2_trades__основной')) localStorage.setItem('poe2_trades__основной', oldT);
  if (oldS && !localStorage.getItem('poe2_stash__основной'))  localStorage.setItem('poe2_stash__основной',  oldS);
}
// Стеш и журнал уникальны на (realm, league, profile): своя комбинация — свой набор.
function scopeKey(prefix) { return prefix + '__' + REALM + '__' + LEAGUE + '__' + activeProfile; }
function tradesKey() { return scopeKey('poe2_trades'); }
function stashKey()  { return scopeKey('poe2_stash');  }
// Один раз переносим старые per-profile ключи в poe2 / Runes of Aldur (где данные и жили).
(function migrateScoped() {
  if (localStorage.getItem('poe2_scoped_migrated')) return;
  getProfiles().forEach(p => {
    ['poe2_trades','poe2_stash'].forEach(pref => {
      const oldK = pref + '__' + p, newK = pref + '__poe2__Runes of Aldur__' + p;
      const v = localStorage.getItem(oldK);
      if (v && !localStorage.getItem(newK)) localStorage.setItem(newK, v);
    });
  });
  localStorage.setItem('poe2_scoped_migrated', '1');
})();

function refreshProfileSel() {
  const sel = document.getElementById('profile-sel');
  if (!sel) return;
  sel.innerHTML = getProfiles().map(p =>
    `<option value="${p.replace(/"/g,'&quot;')}" ${p===activeProfile?'selected':''}>${p}</option>`).join('')
    + '<option value="__new__">➕ новый…</option>';
}
function onProfileSel(v) {
  if (v === '__new__') {
    document.getElementById('profile-new-wrap').style.display = 'flex';
    document.getElementById('profile-sel').value = activeProfile;
    document.getElementById('profile-new-inp').focus();
  } else setProfile(v);
}
function createProfile() {
  const inp = document.getElementById('profile-new-inp');
  const name = (inp.value || '').trim().slice(0, 20);
  if (!name || name === '__new__') return;
  const ps = getProfiles();
  if (!ps.includes(name)) { ps.push(name); saveProfiles(ps); }
  inp.value = '';
  document.getElementById('profile-new-wrap').style.display = 'none';
  setProfile(name);
}
function setProfile(name) {
  activeProfile = name;
  localStorage.setItem('poe2_profile_active', name);
  stashExpanded = new Set();
  refreshProfileSel();
  renderTracker(true);
  renderStash();
}

// Удаление профиля: двухшаговое подтверждение (первый клик «взводит» кнопку на 3 сек)
let profileDelArmed = null;
function deleteProfile() {
  const btn = document.getElementById('profile-del');
  const ps = getProfiles();
  if (ps.length <= 1) {
    btn.textContent = 'последний нельзя';
    setTimeout(() => { btn.textContent = '🗑'; }, 1800);
    return;
  }
  if (profileDelArmed !== activeProfile) {
    profileDelArmed = activeProfile;
    btn.textContent = `удалить «${activeProfile}»?`;
    setTimeout(() => {
      profileDelArmed = null;
      const b = document.getElementById('profile-del');
      if (b) b.textContent = '🗑';
    }, 3000);
    return;
  }
  profileDelArmed = null;
  localStorage.removeItem(tradesKey());
  localStorage.removeItem(stashKey());
  const rest = ps.filter(p => p !== activeProfile);
  saveProfiles(rest);
  btn.textContent = '🗑';
  setProfile(rest[0]);
}

/* ── Пересчёт в рабочую валюту ──
   API всегда отдаёт CurrentPrice в nativeApi реалма (для poe2 — в exalted).
   Если рабочая валюта (baseApi) от неё отличается — пересчитываем ВСЕ цены и
   PriceLogs один раз сразу после загрузки, дальше по коду ничего не меняется:
   вся математика (флип/инвест/бюджет) как и раньше просто оперирует числом в U_BASE. */
function rebaseToWorkUnit(byCategory, uniques, realmCfg) {
  if (realmCfg.baseApi === realmCfg.nativeApi) return; // уже в рабочей валюте, пересчёт не нужен
  const allCur = Object.values(byCategory).flat().filter(Boolean);
  const baseItem = allCur.find(c => c?.ApiId === realmCfg.baseApi);
  if (!(baseItem?.CurrentPrice > 0)) {
    console.warn('rebaseToWorkUnit: валюта', realmCfg.baseApi, 'не найдена в данных — пересчёт пропущен');
    return;
  }
  const factor = 1 / baseItem.CurrentPrice; // native → work (например exalted → chaos)
  const scale = it => {
    if (!it) return;
    if (typeof it.CurrentPrice === 'number') it.CurrentPrice *= factor;
    if (Array.isArray(it.PriceLogs)) it.PriceLogs.forEach(l => { if (l && typeof l.Price === 'number') l.Price *= factor; });
  };
  allCur.forEach(scale);
  (uniques || []).forEach(scale);
}

// Общий бюджет в exalted: div + ex + chaos по текущим курсам
function getBudgetEx() {
  const d = parseFloat(budgetEl.value)   || 0;
  const e = parseFloat(budgetExEl.value) || 0;
  const c = parseFloat(budgetCEl.value)  || 0;
  return d * divinePrice + e + c * chaosPrice;
}
function toDiv(ex) { return ex / divinePrice; }
function fmtD(ex, dec=2) { return toDiv(ex).toFixed(dec) + ' div'; }
function toC(ex) { return ex / chaosPrice; }
function fmtC(ex, dec=1) { return toC(ex).toFixed(dec) + ' ' + U_MID; }

// Иконка предмета рядом с названием (object-fit:contain — без искажений). По имени берёт url из каталога.
// Нет url (новый предмет, который poe2scout ещё не проиндексировал) или картинка не загрузилась —
// показываем нейтральную заглушку вместо пустого места, это не баг, а догоняющие данные апстрима.
function icoImg(url, px) {
  const sz = px || 22;
  const st = ` style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.6)}px"`;
  const PH = '👻';
  const TITLE = 'иконка потерялась (poe2scout её ещё не проиндексировал)';
  if (!url) return `<span class="item-ico item-ico-ph"${st} title="${TITLE}">${PH}</span>`;
  return `<img class="item-ico"${st} src="${url}" loading="lazy" onerror="this.outerHTML='<span class=\\'item-ico item-ico-ph\\'${st.replace(/"/g,'&quot;')} title=\\'${TITLE}\\'>${PH}</span>'" alt="">`;
}
function icoByName(name, px) { return icoImg(marketByText[name] ? marketByText[name].IconUrl : '', px); }

function safeLogs(logs) {
  if (!Array.isArray(logs)) return [];
  // PriceLogs приходят НОВЫЕ→СТАРЫЕ (проверено: [0] = сегодня)
  return logs.filter(l => l && typeof l.Price === 'number' && l.Price > 0);
}
function recentLogs(logs, n) { return safeLogs(logs).slice(0, n); }
function avgQty(logs, n) {
  const sl = recentLogs(logs, n);
  if (!sl.length) return 0;
  return sl.reduce((a,l) => a + (l.Quantity||0), 0) / sl.length;
}

// ── FLIP model: окно 24ч (сегодня к вчера), volatility × liquidity × entry quality ──
// Штраф за тонкий рынок: <100 сделок/день → линейный понижающий фактор
function calcFlipScore(logs, curEx) {
  const sl = recentLogs(logs, 2);
  if (sl.length < 2 || !curEx) return 0;
  const prices = sl.map(l => l.Price);
  const lo = Math.min(...prices), hi = Math.max(...prices);
  if (lo <= 0) return 0;
  const volatility = (hi - lo) / lo;
  const aq = avgQty(logs, 2);
  if (aq < 20) return 0; // неликвид — не флипуется
  const liquidity = Math.log10(aq + 1);
  const liqFactor = Math.min(1, aq / 100);
  const range = hi - lo;
  const entryQuality = range > 0 ? Math.max(0, Math.min(1, (hi - curEx) / range)) : 0.5;
  return volatility * liquidity * liqFactor * (0.5 + entryQuality * 0.5) * 100;
}

// ── INVEST model: окно 3 дня, тренд × консистентность × ликвидность ──
function calcInvestScore(logs) {
  const sl = recentLogs(logs, 3);
  if (sl.length < 3) return 0;
  const prices = sl.map(l => l.Price);
  const newest = prices[0], oldest = prices[prices.length-1];
  if (oldest <= 0) return 0;
  const trend = (newest - oldest) / oldest;
  if (trend <= 0) return 0;
  const aq = avgQty(logs, 3);
  if (aq < 20) return 0;
  const liqFactor = Math.min(1, aq / 50);
  let upSteps = 0;
  for (let i = 0; i < prices.length - 1; i++) {
    if (prices[i] > prices[i+1]) upSteps++; // новее > старее = рост
  }
  const consistency = upSteps / (prices.length - 1);
  const recentP = prices[0], mid = prices[Math.floor(prices.length/2)], oldP = prices[prices.length-1];
  const momentumBonus = (oldP > 0 && mid > 0)
    ? (((recentP - mid) / mid > (mid - oldP) / oldP) ? 1.3 : 1.0)
    : 1.0;
  return trend * 100 * (0.3 + consistency * 0.7) * momentumBonus * liqFactor;
}

// возвращает ЧИСЛО (не строку) или null
function trendPct(logs, days) {
  const sl = recentLogs(logs, days);
  if (sl.length < 2) return null;
  const newest = sl[0].Price, oldest = sl[sl.length-1].Price;
  if (oldest <= 0) return null;
  return (newest - oldest) / oldest * 100;
}

function trendEl(pct) {
  if (pct === null) return '<span class="trend-flat">—</span>';
  const p = pct.toFixed(0);
  if (pct > 5)  return `<span class="trend-up">▲ ${p}%</span>`;
  if (pct < -5) return `<span class="trend-down">▼ ${Math.abs(p)}%</span>`;
  return `<span class="trend-flat">~ ${p}%</span>`;
}

// ── Bids ──
// Flip: buy = current −2%; sell = min(24ч max, cur×1.10)×1.01, floor cur×1.03
function getFlipBids(logs, curEx) {
  const sl = recentLogs(logs, 2);
  if (!sl.length || !curEx) return null;
  const prices = sl.map(l => l.Price);
  const hi1 = Math.max(...prices);
  const buyEx  = curEx * 0.98;
  const sellEx = Math.max(curEx * 1.03, Math.min(hi1, curEx * 1.10) * 1.01);
  const margin = buyEx > 0 ? (sellEx - buyEx) / buyEx * 100 : 0;
  const lo1 = Math.min(...prices);
  const range = hi1 - lo1;
  const eq = range > 0 ? Math.max(0, Math.min(1, (hi1 - curEx) / range)) : 0.5;
  const eqLabel = eq >= 0.6 ? `<span class="entry-good">⬇ хорошо</span>`
                : eq >= 0.3 ? `<span class="entry-ok">→ средне</span>`
                :             `<span class="entry-bad">⬆ высоко</span>`;
  return { buyEx, sellEx, margin, eqLabel };
}

// Invest: target = cur + дневной прирост ×3, cap +50% (линейная экстраполяция врёт на параболах)
function getInvestBids(logs, curEx) {
  const sl = recentLogs(logs, 3);
  if (sl.length < 2 || !curEx) return null;
  const prices = sl.map(l => l.Price);
  const dailyGain = (prices[0] - prices[prices.length-1]) / (prices.length - 1);
  const buyEx  = curEx * 0.98;
  let targetEx = curEx + dailyGain * 3;
  targetEx = Math.min(curEx * 1.5, Math.max(targetEx, curEx * 1.01));
  const gain = buyEx > 0 ? (targetEx - buyEx) / buyEx * 100 : 0;
  return { buyEx, targetEx, gain };
}

function unitsCanBuy(buyEx) {
  const bEx = getBudgetEx();
  if (!bEx || !buyEx) return null;
  return Math.floor(bEx / buyEx);
}
function marginCls(m) {
  return m >= 15 ? 'margin-good' : m >= 7 ? 'margin-ok' : 'margin-low';
}
const MIN_FLIP_MARGIN = 10; // %
function passesFlipMargin(it) {
  const b = getFlipBids(it.PriceLogs, it.CurrentPrice);
  return b && b.margin >= MIN_FLIP_MARGIN;
}

/* ── Portfolio ── */
let pfSplit = parseInt(localStorage.getItem('poe2_pf_split') || '50');

  localStorage.setItem('poe2_pf_split', pfSplit);
  renderPortfolio();
}

function setPfCur(c) {
  pfCur = c;
  localStorage.setItem('poe2_pf_cur', c);

/* Ордеры котируем в EXALTED (целые числа — биржа принимает всегда).
   Все предметы в выборке стоят ≥1 div ≈ 132 ex, так что округление до целого ex теряет <0.5%. */
function renderPortfolio() {
  const el = document.getElementById('portfolio-content');
  if (!el) return;
  const budgetEx = getBudgetEx();
  if (!budgetEx || budgetEx <= 0) {
    el.innerHTML = '<div class="pf-no-budget">Укажи свободные div / ex / chaos в шапке чтобы увидеть рекомендованный портфель</div>';
    return;
  }

  const flipBudEx   = budgetEx * (pfSplit / 100);
  const investBudEx = budgetEx * ((100 - pfSplit) / 100);

  const flipItems   = [...allValidItems]
    .filter(it => it._flip > 0 && it.CurrentPrice <= flipBudEx && passesFlipMargin(it))
    .sort((a,b) => b._flip - a._flip)
    .slice(0, 5);
  const investItems = [...allValidItems]
    .filter(it => it._inv > 0 && it.CurrentPrice <= investBudEx)
    .sort((a,b) => b._inv - a._inv)
    .slice(0, 5);

  // Распределение по score; qty = floor(доля/цена), затем жадная докупка остатка
  // в порядке score, чтобы не оставлять свободные div без работы
  function allocate(items, totalEx, scoreKey, getSell) {
    if (!items.length) return { rows: [], leftover: totalEx };
    const totalScore = items.reduce((s,it) => s + (it[scoreKey] || 1), 0);
    const rows = [];
    for (const it of items) {
      const buyExI  = Math.max(1, Math.round(it.CurrentPrice * 0.98));
      const sellRaw = getSell(it);
      if (!sellRaw) continue;
      const sellExI = Math.max(buyExI + 1, Math.round(sellRaw));
      const share = totalEx * ((it[scoreKey] || 1) / totalScore);
      rows.push({ it, qty: Math.floor(share / buyExI), buyExI, sellExI });
    }
    let leftover = totalEx - rows.reduce((s,r) => s + r.qty * r.buyExI, 0);
    // докупаем по кругу (rows уже отсортированы по score), пока хоть что-то влезает
    let progress = true;
    while (progress) {
      progress = false;
      for (const r of rows) {
        if (r.buyExI <= leftover) { r.qty++; leftover -= r.buyExI; progress = true; }
      }
    }
    return {
      rows: rows.filter(r => r.qty > 0).map(r => ({ ...r,
        costEx: r.qty * r.buyExI,
        profitEx: r.qty * (r.sellExI - r.buyExI) })),
      leftover
    };
  }

  const flipRes = allocate(flipItems, flipBudEx, '_flip', it => {
    const b = getFlipBids(it.PriceLogs, it.CurrentPrice);
    return b ? b.sellEx : null;
  });
  const investRes = allocate(investItems, investBudEx, '_inv', it => {
    const b = getInvestBids(it.PriceLogs, it.CurrentPrice);
    return b ? b.targetEx : null;
  });
  const leftoverEx = flipRes.leftover + investRes.leftover;

  // Котирование ордеров в выбранной валюте: оба тотала — целые числа (требование биржи).
  // В div/c шаг сетки крупнее — если округлённая продажа ≤ закупки, поднимаем на 1 шаг и помечаем ⚠.
  const CUR = { ex: {label:U_BASE, rate:1}, div: {label:'div', rate:divinePrice}, c: {label:U_MID, rate:chaosPrice} };
  const cur = CUR[pfCur] || CUR.ex;
  function quote(r) {
    const buyTot  = Math.max(1, Math.round(r.qty * r.buyExI / cur.rate));
    const sellRaw = Math.round(r.qty * r.sellExI / cur.rate);
    const gridWarn = sellRaw <= buyTot;
    const sellTot = Math.max(buyTot + 1, sellRaw);
    return { ...r, buyTot, sellTot, gridWarn,
      costEx: buyTot * cur.rate,
      profitEx: (sellTot - buyTot) * cur.rate };
  }
  const flipAlloc   = flipRes.rows.map(quote);
  const investAlloc = investRes.rows.map(quote);

  const flipSpent    = flipAlloc.reduce((s,r) => s + r.costEx, 0);
  const investSpent  = investAlloc.reduce((s,r) => s + r.costEx, 0);
  const flipProfit   = flipAlloc.reduce((s,r) => s + r.profitEx, 0);
  const investProfit = investAlloc.reduce((s,r) => s + r.profitEx, 0);

  function pfRows(alloc, mode) {
    if (!alloc.length) return '<div class="pf-row" style="color:var(--faint);font-size:11px;padding:12px 13px">Нет подходящих позиций в рамках бюджета</div>';
    const modeLabel = mode === 'flip' ? 'продажа' : 'цель +3д';
    return alloc.map((r,i) => {
      const profEx = r.profitEx; // qty уже учтён — НЕ умножать ещё раз
      const profCls = toDiv(profEx) >= 0.5 ? 'pf-profit-good' : 'pf-profit-ok';
      const unitBuyEx  = r.buyTot  * cur.rate / r.qty;
      const unitSellEx = r.sellTot * cur.rate / r.qty;
      return `<div class="pf-row">
        <div class="pf-num">${i+1}</div>
        ${icoImg(r.it.IconUrl)}
        <div class="pf-info">
          <div class="pf-name" title="${r.it.Text}">${r.it.Text}</div>
          <div class="pf-detail" style="color:var(--buy);font-weight:600">закупка: ${r.qty} шт за ${r.buyTot} ${cur.label} (≈${unitBuyEx.toFixed(0)} ${U_BASE}/шт)</div>
          <div class="pf-detail" style="color:var(--gain)">${modeLabel}: ${r.qty} шт за ${r.sellTot} ${cur.label} (≈${unitSellEx.toFixed(0)} ${U_BASE}/шт)</div>

/* ── Trade tracker ──
   Журнал сделок в localStorage. Цена за штуку в выбранной валюте;
   в момент записи фиксируется курс (priceEx) — прошлые сделки не «переоцениваются».
   P&L: средняя цена закупки по предмету; реализованная = выручка − ср.закупка × мин(продано, куплено);
   нереализованная = (рыночная − ср.закупка) × остаток по живой цене poe2scout. */
function getTrades() {
  try { const t = JSON.parse(localStorage.getItem(tradesKey()) || '[]'); return Array.isArray(t) ? t : []; }
  catch { return []; }
}
function saveTrades(t) { localStorage.setItem(tradesKey(), JSON.stringify(t)); }

function curRate(cur) { return cur === 'div' ? divinePrice : cur === 'c' ? chaosPrice : 1; }

function addTrade() {
  const errEl = document.getElementById('tr-err');
  errEl.textContent = '';
  const side  = document.getElementById('tr-side').value;
  const item  = document.getElementById('tr-item').value.trim();
  const qty   = parseInt(document.getElementById('tr-qty').value);
  const price = parseFloat(document.getElementById('tr-price').value);
  const cur   = document.getElementById('tr-cur').value;
  if (!item) { errEl.textContent = 'укажи предмет'; return; }
  if (!qty || qty < 1) { errEl.textContent = 'кол-во ≥ 1'; return; }
  if (!price || price <= 0) { errEl.textContent = 'цена > 0'; return; }
  const trades = getTrades();
  trades.push({
    id: Date.now(),
    ts: new Date().toLocaleString('ru', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }),
    item, side, qty, price, cur,
    priceEx: price * curRate(cur)
  });
  saveTrades(trades);
  renderTracker(true);
}

function delTrade(id) {
  saveTrades(getTrades().filter(t => t.id !== id));
  renderTracker(true);
}

function renderTracker(keepItem) {
  const el = document.getElementById('tracker-content');
  if (!el) return;
  const prevItem = keepItem ? '' : (document.getElementById('tr-item')?.value || '');
  const trades = getTrades();

  // ── сводка по предметам ──
  const byItem = {};
  for (const t of trades) {
    const o = byItem[t.item] ?? (byItem[t.item] = { buyQ:0, buyEx:0, sellQ:0, sellEx:0 });
    if (t.side === 'buy') { o.buyQ += t.qty; o.buyEx += t.qty * t.priceEx; }
    else                  { o.sellQ += t.qty; o.sellEx += t.qty * t.priceEx; }
  }
  let totalRealized = 0, totalUnreal = 0, hasUnreal = false;
  const sumRows = Object.entries(byItem).map(([name, o]) => {
    const avgBuy  = o.buyQ  ? o.buyEx  / o.buyQ  : 0;
    const matched = Math.min(o.sellQ, o.buyQ);
    const noBasis = o.sellQ > o.buyQ;
    const realized = o.sellEx - avgBuy * matched; // непокрытые продажи идут с базой 0 (помечаем)
    totalRealized += realized;
    const open = o.buyQ - matched;
    const mkt = marketByText[name];
    let unrealStr = '<span class="pnl-na">—</span>';
    if (open > 0 && mkt && mkt.CurrentPrice > 0) {
      const unreal = (mkt.CurrentPrice - avgBuy) * open;
      totalUnreal += unreal; hasUnreal = true;
      unrealStr = `<span class="${unreal>=0?'pnl-pos':'pnl-neg'}">${unreal>=0?'+':''}${toDiv(unreal).toFixed(2)} div</span>`;
    } else if (open > 0) {
      unrealStr = '<span class="pnl-na">нет рын. цены</span>';
    }
    const realStr = (o.sellQ > 0)
      ? `<span class="${realized>=0?'pnl-pos':'pnl-neg'}">${realized>=0?'+':''}${toDiv(realized).toFixed(2)} div</span>${noBasis?' <span class="pnl-na" title="продано больше чем куплено — часть без базы">⚠</span>':''}`
      : '<span class="pnl-na">—</span>';
    return `<tr>
      <td><div class="name-with-ico">${icoByName(name)}<div class="item-name">${name}</div></div></td>
      <td>${o.buyQ ? `${o.buyQ} шт · ср. ${fmtD(avgBuy)}` : '—'}</td>
      <td>${o.sellQ ? `${o.sellQ} шт · ср. ${fmtD(o.sellQ ? o.sellEx/o.sellQ : 0)}` : '—'}</td>
      <td>${open > 0 ? `<span class="units-badge">× ${open}</span>` : '—'}</td>
      <td>${realStr}</td>
      <td>${unrealStr}</td>
    </tr>`;
  }).join('');

  // ── журнал ──
  const logRows = [...trades].reverse().map(t => `<tr>
    <td style="white-space:nowrap;color:var(--faint);font-size:11px">${t.ts}</td>
    <td><span class="${t.side==='buy'?'tr-side-buy':'tr-side-sell'}">${t.side==='buy'?'Покупка':'Продажа'}</span></td>
    <td><div class="name-with-ico">${icoByName(t.item)}<div class="item-name">${t.item}</div></div></td>
    <td>${t.qty} шт</td>
    <td>${t.price} ${t.cur} <span class="bid-sub">(${fmtD(t.priceEx)}/шт)</span></td>
    <td>${(t.qty*t.price).toFixed(t.cur==='ex'?0:2)} ${t.cur} <span class="bid-sub">≈ ${fmtD(t.qty*t.priceEx,1)}</span></td>
    <td><button class="tr-del" onclick="delTrade(${t.id})" title="удалить">✕</button></td>
  </tr>`).join('');

  const total = totalRealized + totalUnreal;
  const pnlCls = v => v >= 0 ? 'pnl-pos' : 'pnl-neg';
  const summaryBar = trades.length ? `
    <div class="pf-summary">
      <div class="pf-summary-item">✅ Реализовано: <span class="${pnlCls(totalRealized)}">${totalRealized>=0?'+':''}${toDiv(totalRealized).toFixed(2)} div · ${fmtC(totalRealized,0)}</span></div>
      <div class="pf-summary-item">📊 Нереализовано: <span class="${hasUnreal?pnlCls(totalUnreal):'pnl-na'}">${hasUnreal?(totalUnreal>=0?'+':'')+toDiv(totalUnreal).toFixed(2)+' div · '+fmtC(totalUnreal,0):'—'}</span></div>
      <div class="pf-summary-item">💰 Итого: <span class="${pnlCls(total)}">${total>=0?'+':''}${toDiv(total).toFixed(2)} div · ${fmtC(total,0)}</span></div>
    </div>` : '';

  el.innerHTML = `
    <div class="tr-form">
      <select id="tr-side">
        <option value="buy">Покупка</option>
        <option value="sell">Продажа</option>
      </select>
      <input class="tr-item-inp" id="tr-item" list="items-dl" placeholder="Предмет (автоподстановка)" value="${prevItem.replace(/"/g,'&quot;')}">
      <input id="tr-qty" type="number" min="1" step="1" placeholder="кол-во" style="width:70px">
      <input id="tr-price" type="number" min="0" step="any" placeholder="цена/шт" style="width:80px">
      <select id="tr-cur">
        <option value="ex">${U_BASE}</option>
        <option value="div">div</option>
        <option value="c">${U_MID}</option>
      </select>
      <button class="tr-btn" onclick="addTrade()">+ Записать</button>
      <span class="tr-err" id="tr-err"></span>
    </div>
    ${sumRows ? `<div style="overflow-x:auto"><table><thead><tr><th>Предмет</th><th>Куплено</th><th>Продано</th><th>Остаток</th><th>Реализ. P&L</th><th>Нереализ. P&L</th></tr></thead><tbody>${sumRows}</tbody></table></div>` : ''}
    ${logRows ? `<div style="overflow-x:auto;border-top:1px solid var(--line-soft)"><table><thead><tr><th>Когда</th><th>Тип</th><th>Предмет</th><th>Кол-во</th><th>Цена/шт</th><th>Сумма</th><th></th></tr></thead><tbody>${logRows}</tbody></table></div>`
                : '<div class="no-data">Сделок пока нет — запиши первую покупку или продажу</div>'}
    ${summaryBar}`;
}

// Парсер игрового Ctrl+C: имя = последняя строка первого блока без Item Class/Rarity,
// количество из "Stack Size: N/M"
function parseItemText(text) {
  if (!text || !text.trim()) return null;
  const norm = text.replace(/\r/g, '');
  const blocks = norm.split(/\n\s*-{4,}\s*\n/);
  const first = (blocks[0] || '').split('\n').map(s => s.trim()).filter(Boolean);
  const nameCands = first.filter(l => !/^(Item Class|Rarity)\s*:/i.test(l));
  let qty = 1;
  const m = norm.match(/Stack Size\s*:\s*([\d,]+)\s*\/\s*[\d,]+/i);
  if (m) qty = parseInt(m[1].replace(/,/g, '')) || 1;
  return { nameCands, qty };
}

function findMarketItem(nameCands) {
  const keys = Object.keys(marketByText);
  for (let i = nameCands.length - 1; i >= 0; i--) {
    const c = nameCands[i].toLowerCase();
    const k = keys.find(k => k.toLowerCase() === c);
    if (k) return marketByText[k];
  }
  return null;
}

/* Рекомендация продать/держать. Сигналы и веса (окно оценки — 3 дня):
   1) 3д тренд: >+35% перегрев (−1), +10..35 рост (+1), <−10% падение (−2: дальше дешевле)
   2) 24ч: просадка >3% после сильного роста (−2: окно фиксации; это и есть сигнал разворота
      при коротком окне — раньше сравнивали 7д с 3д, но с одинаковыми окнами это лишено смысла); +3% (+1)
   3) позиция в 3д диапазоне: у максимума (−1: выгодно продать), у дна без падения (+1: продавать невыгодно)
   4) предложение: −40% объёма за 3д (+1: дефицит), +60% (−1: давление)
   5) ликвидность <20/день — предупреждение без очков
   Σ: ≤−3 продавать сейчас, −1..−2 скорее продавать, 0 нейтрально, 1..2 скорее держать, ≥3 держать */
function adviseItem(it) {
  const logs = safeLogs(it.PriceLogs);
  const cur = it.CurrentPrice;
  const t3 = trendPct(logs, 3);
  const yest = logs.length >= 2 ? logs[1].Price : null;
  const day = yest ? (cur - yest) / yest * 100 : null;
  const win = recentLogs(logs, 3);
  const qNew = win[0]?.Quantity || 0, qOld = win[win.length-1]?.Quantity || 0;
  const supply = qOld > 0 ? (qNew - qOld) / qOld * 100 : null;
  const aq = avgQty(logs, 3);
  const prices = win.map(l => l.Price);
  const hi3 = Math.max(...prices, cur), lo3 = Math.min(...prices, cur);
  const pos = hi3 > lo3 ? (cur - lo3) / (hi3 - lo3) : 0.5;

  let score = 0;
  const reasons = [];
  if (t3 !== null) {
    if (t3 > 35)       { score -= 1; reasons.push(`📈 +${t3.toFixed(0)}% за 3д — цена перегрета, растёт риск отката`); }
    else if (t3 > 10)  { score += 1; reasons.push(`📈 устойчивый рост +${t3.toFixed(0)}% за 3д`); }
    else if (t3 < -10) { score -= 2; reasons.push(`📉 ${t3.toFixed(0)}% за 3д — нисходящий тренд, дальше скорее дешевле`); }
    else reasons.push(`↔ 3д тренд слабый (${t3 >= 0 ? '+' : ''}${t3.toFixed(0)}%)`);
  }
  if (day !== null) {
    if (day < -3 && (t3 ?? 0) > 20) { score -= 2; reasons.push(`⏰ ${day.toFixed(1)}% за 24ч после сильного роста — окно фиксации прибыли`); }
    else if (day > 3)               { score += 1; reasons.push(`▲ +${day.toFixed(1)}% за 24ч`); }
  }
  if (pos > 0.9)                          { score -= 1; reasons.push(`🎯 цена у максимума 3д диапазона — выгодная точка продажи`); }
  else if (pos < 0.2 && (t3 ?? 0) >= 0)   { score += 1; reasons.push(`🛟 цена у дна диапазона и не падает — продавать сейчас невыгодно`); }
  if (supply !== null) {
    if (supply < -40)     { score += 1; reasons.push(`📦 предложение упало на ${Math.abs(supply).toFixed(0)}% за 3д — дефицит поддерживает цену`); }
    else if (supply > 60) { score -= 1; reasons.push(`📦 предложение выросло на ${supply.toFixed(0)}% — давление на цену`); }
  }
  if (aq < 20) reasons.push(`🐌 низкая ликвидность (~${aq.toFixed(0)} сделок/день) — продажа может занять время`);

  let verdict, cls;
  if (score <= -3)      { verdict = '🔻 ПРОДАВАТЬ СЕЙЧАС'; cls = 'verdict-sell'; }
  else if (score <= -1) { verdict = '💰 СКОРЕЕ ПРОДАВАТЬ'; cls = 'verdict-sell'; }
  else if (score >= 3)  { verdict = '🔥 ДЕРЖАТЬ'; cls = 'verdict-hold'; }
  else if (score >= 1)  { verdict = '✊ СКОРЕЕ ДЕРЖАТЬ'; cls = 'verdict-hold'; }
  else                  { verdict = '↔ НЕЙТРАЛЬНО'; cls = 'verdict-neutral'; }
  return { verdict, cls, reasons, score };
}

// Вставка из буфера: clipboard API может быть заблокирован в песочнице — тогда подсказываем Ctrl+V
async function pcPaste() {
  const ta = document.getElementById('pc-input');
  const res = document.getElementById('pc-result');
  try {
    const txt = await navigator.clipboard.readText();
    if (txt && txt.trim()) {
      ta.value = txt;
      pcEvaluate(); // сразу оцениваем
    } else {
      res.innerHTML = '<div class="no-data">Буфер обмена пуст — скопируй предмет в игре (Ctrl+C)</div>';
    }
  } catch (e) {
    ta.value = '';
    ta.focus();
    res.innerHTML = '<div class="no-data">Песочница не даёт читать буфер напрямую. Поле уже в фокусе — просто нажми <b>Ctrl+V</b>, оценка запустится автоматически.</div>';
  }
}

function pcEvaluate() {
  const res = document.getElementById('pc-result');
  const txt = document.getElementById('pc-input').value;
  pcLast = null;
  const parsed = parseItemText(txt);
  if (!parsed || !parsed.nameCands.length) {
    res.innerHTML = '<div class="no-data">Не удалось распознать предмет — вставь текст целиком (Ctrl+C на предмете в игре)</div>';
    return;
  }
  const it = findMarketItem(parsed.nameCands);
  if (!it) {
    res.innerHTML = `<div class="no-data">«${parsed.nameCands[parsed.nameCands.length-1]}» не найден в валютных данных poe2scout</div>`;
    return;
  }
  const qty = parsed.qty;
  pcLast = { it, qty };
  const a = adviseItem(it);
  const unit = it.CurrentPrice, stack = unit * qty;
  res.innerHTML = `<div class="pc-res">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
      ${icoImg(it.IconUrl,34)}
      <div>
        <div class="item-name" style="font-size:14px">${it.Text}</div>
        <div class="item-cat">${CAT_LABELS[it.CategoryApiId]||it.CategoryApiId} · ${qty} шт</div>
      </div>
      <div class="verdict-badge ${a.cls}" style="margin-left:auto">${a.verdict}</div>
    </div>
    <div class="pc-prices">
      <div class="pc-price-box"><div class="lbl">за 1 шт</div><div class="val">${unit.toFixed(unit<10?2:1)} ${U_BASE}</div><div class="bid-sub">${toDiv(unit).toFixed(3)} div · ${toC(unit).toFixed(1)} ${U_MID}</div></div>
      <div class="pc-price-box"><div class="lbl">стак (${qty} шт)</div><div class="val">${stack.toFixed(0)} ${U_BASE}</div><div class="bid-sub">${toDiv(stack).toFixed(2)} div · ${toC(stack).toFixed(0)} ${U_MID}</div></div>
    </div>
    ${a.reasons.map(r => `<div class="pc-reason">${r}</div>`).join('')}
    <div class="pc-reason" style="color:var(--faint);margin-top:4px">Оценка по 3-дневной динамике poe2scout; патчи, анонсы и конец лиги не учитываются.</div>
    <div class="pc-reason" style="color:var(--gain);margin-top:6px;font-weight:600">✓ автоматически добавлено в Stash ниже</div>
    <button class="tr-btn" style="margin-top:6px" onclick="stashAdd()">↻ Обновить кол-во в Stash</button>
  </div>`;
  stashAdd(); // авто-добавление в стеш после вставки из буфера
}

/* Stash */
function getStash() {
  try { const s = JSON.parse(localStorage.getItem(stashKey()) || '[]'); return Array.isArray(s) ? s : []; }
  catch { return []; }
}
function saveStash(s) { localStorage.setItem(stashKey(), JSON.stringify(s)); }

function stashAdd() {
  if (!pcLast) return;
  const s = getStash();
  const ts = new Date().toLocaleString('ru', { day:'2-digit', month:'2-digit' });
  const existing = s.find(x => x.name === pcLast.it.Text);
  if (existing) {
    // повторное добавление: обновляем количество (базовая цена и дата добавления сохраняются для Δ)
    existing.qty = pcLast.qty;
  } else {
    s.push({ id: Date.now(), name: pcLast.it.Text, qty: pcLast.qty, addPriceEx: pcLast.it.CurrentPrice, ts });
  }
  saveStash(s);
  renderStash();
}
function stashDel(id) { saveStash(getStash().filter(x => x.id !== id)); renderStash(); }

// раскрытие обоснования рекомендации по клику на предмет
let stashExpanded = new Set();
function stashToggle(id) {
  if (stashExpanded.has(id)) stashExpanded.delete(id); else stashExpanded.add(id);
  renderStash();
}

/* Сортировка стеша. Дефолтные направления при первом клике:
   имя — A→Я; кол-во, цена/шт, стак, Δ — по убыванию;
   рекомендация — по срочности: продавать сейчас > скорее продавать > нейтрально > скорее держать > держать.
   Повторный клик — реверс. */
let stashSort = (() => {
  try { return JSON.parse(localStorage.getItem('poe2_stash_sort') || 'null') || { key: null, dir: 1 }; }
  catch { return { key: null, dir: 1 }; }
})();

function setStashSort(key) {
  if (stashSort.key === key) stashSort.dir *= -1;
  else stashSort = { key, dir: (key === 'name' || key === 'verdict') ? 1 : -1 };
  localStorage.setItem('poe2_stash_sort', JSON.stringify(stashSort));
  renderStash();
}

function renderStash() {
  const el = document.getElementById('pc-stash');
  if (!el) return;
  const s = getStash();
  const cnt = document.getElementById('stash-count');
  if (cnt) cnt.textContent = s.length;
  if (!s.length) { el.innerHTML = '<div class="no-data">Stash пуст — оцени предмет выше и добавь его сюда</div>'; return; }
  let totNowEx = 0, totAddEx = 0;
  const data = s.map(x => {
    const mkt = marketByText[x.name];
    const unit = mkt ? mkt.CurrentPrice : x.addPriceEx;
    const now = unit * x.qty, was = x.addPriceEx * x.qty;
    totNowEx += now; totAddEx += was;
    const d = was > 0 ? (now - was) / was * 100 : 0;
    const a = mkt ? adviseItem(mkt) : null;
    // ранг срочности: 0 продавать сейчас … 4 держать, 5 нет данных
    const rank = !a ? 5 : a.score <= -3 ? 0 : a.score <= -1 ? 1 : a.score >= 3 ? 4 : a.score >= 1 ? 3 : 2;
    return { x, unit, now, d, a, rank };
  });
  if (stashSort.key) {
    const { key, dir } = stashSort;
    data.sort((A, B) => {
      if (key === 'name') return A.x.name.localeCompare(B.x.name) * dir;
      const v = r => key === 'qty' ? r.x.qty : key === 'unit' ? r.unit : key === 'now' ? r.now : key === 'delta' ? r.d : r.rank;
      return (v(A) - v(B)) * dir;
    });
  }
  const arr = k => stashSort.key === k ? (stashSort.dir === 1 ? ' ↑' : ' ↓') : '';
  const rows = data.map(({ x, unit, now, d, a }) => {
    const expanded = stashExpanded.has(x.id);
    const hoverTitle = a ? a.reasons.join('&#10;') : 'нет данных по предмету';
    const detailRow = expanded && a ? `<tr><td colspan="7" style="background:var(--surface-2);padding:8px 16px">
        ${a.reasons.map(r => `<div class="pc-reason">${r}</div>`).join('')}
        <div class="pc-reason" style="color:var(--faint)">Оценка по 3-дневной динамике poe2scout.</div>
      </td></tr>` : '';
    return `<tr>
      <td class="sort" onclick="stashToggle(${x.id})" title="${hoverTitle}">
        <div class="name-with-ico">${icoByName(x.name)}<div>
          <div class="item-name">${expanded ? '▾' : '▸'} ${x.name}</div>
          <div class="item-cat">добавлен ${x.ts} · клик — обоснование</div>
        </div></div>
      </td>
      <td>${x.qty} шт</td>
      <td><div class="price-now">${unit.toFixed(unit<10?2:1)} ${U_BASE}</div><div class="bid-sub">${toDiv(unit).toFixed(3)} div · ${toC(unit).toFixed(1)} ${U_MID}</div></td>
      <td><div class="price-now">${toDiv(now).toFixed(2)} div</div><div class="bid-sub">${now.toFixed(0)} ${U_BASE} · ${toC(now).toFixed(0)} ${U_MID}</div></td>
      <td><span class="${d>=0?'pnl-pos':'pnl-neg'}">${d>=0?'+':''}${d.toFixed(1)}%</span><div class="bid-sub">с добавления</div></td>
      <td>${a ? `<span style="font-size:11px;font-weight:700" class="${a.cls==='verdict-sell'?'pnl-neg':a.cls==='verdict-hold'?'pnl-pos':'pnl-na'}">${a.verdict}</span>` : '<span class="pnl-na">нет данных</span>'}</td>
      <td><button class="tr-del" onclick="stashDel(${x.id})" title="продано / убрать">✕</button></td>
    </tr>${detailRow}`;
  }).join('');
  const dTot = totAddEx > 0 ? (totNowEx - totAddEx) / totAddEx * 100 : 0;
  el.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr>
      <th class="sort" onclick="setStashSort('name')">Предмет${arr('name')}</th>
      <th class="sort" onclick="setStashSort('qty')">Кол-во${arr('qty')}</th>
      <th class="sort" onclick="setStashSort('unit')">Цена/шт${arr('unit')}</th>
      <th class="sort" onclick="setStashSort('now')">Стак сейчас${arr('now')}</th>
      <th class="sort" onclick="setStashSort('delta')">Δ${arr('delta')}</th>
      <th class="sort" onclick="setStashSort('verdict')">Рекомендация${arr('verdict')}</th>
      <th></th>
    </tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="pf-summary">
      <div class="pf-summary-item">💎 Стеш сейчас: <span>${toDiv(totNowEx).toFixed(2)} div · ${fmtC(totNowEx,0)} · ${totNowEx.toFixed(0)} ${U_BASE}</span></div>
      <div class="pf-summary-item">Δ с добавления: <span class="${dTot>=0?'pnl-pos':'pnl-neg'}">${dTot>=0?'+':''}${toDiv(totNowEx-totAddEx).toFixed(2)} div (${dTot.toFixed(1)}%)</span></div>
    </div>`;
}

/* ── Uniques: раздел и таблица ──
   Цена уникалов в exalted, как у валюты. Ликвидность критична: у многих
   junk-уникалов 1–3 листинга и тролльные цены, поэтому показываем объём явно. */
function uniqLiquidity(it) {
  const aq = avgQty(it.PriceLogs, 3) || it.CurrentQuantity || 0;
  if (aq >= 20) return { aq, label: `${aq.toFixed(0)}/д`, cls: 'liq-hi' };
  if (aq >= 5)  return { aq, label: `${aq.toFixed(0)}/д`, cls: 'liq-md' };
  return { aq, label: `${aq.toFixed(0)}/д`, cls: 'liq-lo' };
}

function setUniqCat(cat) { uniqCat = cat; renderUniques(); }

function uniqTabsHtml() {
  return Object.keys(UNIQUE_CATS).map(c => {
    const active = c === uniqCat ? 'active-uniq' : '';
    const n = allUniques.filter(u => u.CategoryApiId === c).length;
    return `<button class="cat-tab ${active}" onclick="setUniqCat('${c}')">${UNIQUE_CATS[c]}${n?` <span style="opacity:.6">${n}</span>`:''}</button>`;
  }).join('');
}

function renderUniqTable() {
  const items = allUniques
    .filter(u => u.CategoryApiId === uniqCat && u.CurrentPrice > 0)
    .sort((a,b) => b.CurrentPrice - a.CurrentPrice)
    .slice(0, 20);
  if (!items.length) return '<div class="no-data">Нет данных по уникалам в этой категории</div>';
  const hdr = `<tr><th>#</th><th>Предмет</th><th>Цена (div)</th><th>${U_BASE} · ${U_MID}</th><th>Ликвидность</th><th>3д тренд</th><th></th></tr>`;
  const rows = items.map((it, i) => {
    const liq = uniqLiquidity(it);
    const t7 = trendPct(it.PriceLogs, 3);
    const base = it.ItemMetadata?.base_type || it.Type || '';
    const nm = (it.Name || it.Text || '').replace(/'/g, "\\'");
    return `<tr>
      <td><span class="rank ${i<3?'top3':''}">${i+1}</span></td>
      <td><div style="display:flex;align-items:center;gap:7px">
        <img class="uniq-icon" src="${it.IconUrl}" onerror="this.style.display='none'">
        <div><div class="uniq-name">${it.Name || it.Text}</div><div class="uniq-base">${base}</div></div>
      </div></td>
      <td><div class="price-now">${toDiv(it.CurrentPrice).toFixed(toDiv(it.CurrentPrice)<10?2:0)} div</div></td>
      <td><div class="bid-sub" style="color:var(--faint)">${it.CurrentPrice.toFixed(0)} ${U_BASE} · ${toC(it.CurrentPrice).toFixed(0)} ${U_MID}</div></td>
      <td><span class="liq-badge ${liq.cls}">${liq.label}</span></td>
      <td>${trendEl(t7)}</td>
      <td><button class="cur-btn" style="font-size:10px" onclick="pcxOpen('${(it.Text||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">📊 разбор</button></td>
    </tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table><thead>${hdr}</thead><tbody>${rows}</tbody></table></div>`;
}

function renderUniques() {
  const tabs = document.getElementById('uniq-tabs');
  const body = document.getElementById('uniq-content');
  if (tabs) tabs.innerHTML = uniqTabsHtml();
  if (body) body.innerHTML = renderUniqTable();
}

/* ── Price Check (выпадающий список): курс, описание, график, аналитика ── */
let pcxChart = null;
let pcxCurrent = null;

// Datalist со ВСЕМИ предметами (валюта + расходники + уникалы).
// <datalist> в Chromium фильтрует опции по любой части строки — поиск по подстроке.
// Различаем уникал/валюту по категории (у валюты тоже есть ItemMetadata, поэтому по нему нельзя).
function isUniqueItem(it) { return !!UNIQUE_CATS[it.CategoryApiId]; }

function fillPcxList(preselectText) {
  const dl = document.getElementById('pcx-dl');
  if (!dl) return;
  const esc = s => (s||'').replace(/"/g,'&quot;');
  const items = Object.values(marketByText).filter(it => it && it.Text);
  items.sort((a,b) => (b.CurrentPrice||0) - (a.CurrentPrice||0)); // дорогие сверху
  dl.innerHTML = items.map(it => {
    const isU = isUniqueItem(it);
    const cat = isU ? UNIQUE_CATS[it.CategoryApiId] : (CAT_LABELS[it.CategoryApiId] || it.CategoryApiId);
    const pd = it.CurrentPrice > 0 ? toDiv(it.CurrentPrice).toFixed(toDiv(it.CurrentPrice) < 10 ? 2 : 1) + ' div' : '—';
    const nm = isU ? (it.Name || it.Text) : it.Text;
    return `<option value="${esc(it.Text)}" label="${esc(nm)} — ${pd} · ${cat}"></option>`;
  }).join('');
  const inp = document.getElementById('pcx-input');
  if (inp && preselectText) inp.value = preselectText;
}

// Ввод в поле: рендерим разбор только при точном совпадении (после выбора из подсказок)
function pcxInput() {
  const v = (document.getElementById('pcx-input')?.value || '').trim();
  if (!v) { pcxSelect(''); return; }
  if (marketByText[v]) pcxSelect(v);
}

function pcxSelect(text) {
  const res = document.getElementById('pcx-result');
  if (!text) { if (res) res.innerHTML = '<div class="no-data">Выбери предмет из списка — покажу курс, историю и аналитику</div>'; return; }
  const it = marketByText[text];
  if (!it) { if (res) res.innerHTML = '<div class="no-data">Предмет не найден в данных poe2scout</div>'; return; }
  renderPcx(it);
}

// Открыть Price Check на конкретном предмете (кнопка «разбор» из уникалов)
function pcxOpen(text) {
  switchMainTab('pricecheck');
  fillPcxList(text);
  const inp = document.getElementById('pcx-input');
  if (inp) inp.value = text;
  pcxSelect(text);
  document.getElementById('tab-pricecheck')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function pcxDescribe(it) {
  const m = it.ItemMetadata || {};
  if (!isUniqueItem(it)) {
    // валюта / расходник: у ItemMetadata есть description / effect / стак
    const eff = (m.effect || []).map(x => `<div class="pcx-mod-exp">${x}</div>`).join('');
    const desc = m.description ? `<div class="pcx-prop" style="margin-top:5px;color:var(--muted)">${m.description}</div>` : '';
    const stack = m.max_stack_size ? `<div class="pcx-prop">Макс. размер стака: <b>${m.max_stack_size}</b></div>` : '';
    return `<div class="pcx-info-card">
      <div class="pcx-section-h">Описание</div>
      <div class="pcx-prop">Категория: <b>${CAT_LABELS[it.CategoryApiId]||it.CategoryApiId}</b> · стакающийся расходник (Currency Exchange)</div>
      ${eff}${stack}${desc}
    </div>`;
  }
  const props = m.properties ? Object.entries(m.properties)
    .map(([k,v]) => v===null ? `<div class="pcx-prop" style="font-weight:700;color:var(--muted)">${k}</div>` : `<div class="k">${k}</div><div class="v">${v}</div>`) : [];
  const propGrid = props.length ? `<div class="pcx-stat-grid">${props.join('')}</div>` : '';
  const imp = (m.implicit_mods||[]).map(x => `<div class="pcx-mod-imp">${x}</div>`).join('');
  const exp = (m.explicit_mods||[]).map(x => `<div class="pcx-mod-exp">${x}</div>`).join('');
  const req = m.requirements && Object.keys(m.requirements).length
    ? `<div class="pcx-prop" style="margin-top:6px">Требования: ${Object.entries(m.requirements).map(([k,v])=>`${k} ${v}`).join(', ')}</div>` : '';
  const flavor = m.flavor_text ? `<div class="pcx-flavor">${m.flavor_text}</div>` : '';
  return `<div class="pcx-info-card">
    <div class="pcx-section-h">${m.base_type||it.Type||'Уникальный предмет'}${m.item_level?` · iLvl ${m.item_level}`:''}</div>
    ${propGrid}
    <div class="pcx-mods" style="margin-top:8px">${imp}${imp&&exp?'<div style="height:5px"></div>':''}${exp}</div>
    ${req}${flavor}
  </div>`;
}

function renderPcx(it) {
  const res = document.getElementById('pcx-result');
  if (!res) return;
  pcxCurrent = it;
  const a = adviseItem(it);
  const ex = it.CurrentPrice;
  const isUniq = isUniqueItem(it);
  const liq = isUniq ? uniqLiquidity(it) : null;
  const liqLine = isUniq
    ? `<span class="liq-badge ${liq.cls}" title="средний объём листингов">ликвидность ${liq.label}</span>`
    : '';
  res.innerHTML = `<div class="pcx-body">
    <div class="pcx-head">
      <img src="${it.IconUrl}" onerror="this.style.display='none'">
      <div style="flex:1;min-width:0">
        <div class="pcx-title">${it.Name || it.Text}</div>
        <div class="pcx-subtitle">${isUniq ? (it.Text||'') + ' · ⭐ ' + (UNIQUE_CATS[it.CategoryApiId]||it.CategoryApiId) : (CAT_LABELS[it.CategoryApiId]||it.CategoryApiId)} ${liqLine}</div>
      </div>
      <div class="verdict-badge ${a.cls}">${a.verdict}</div>
    </div>
    <div class="pcx-prices">
      <div class="pcx-pbox"><div class="lbl">Divine</div><div class="val">${toDiv(ex).toFixed(toDiv(ex)<10?3:2)} <span class="unit">div</span></div></div>
      <div class="pcx-pbox"><div class="lbl">${U_BASE==='ex'?'Exalted':'Chaos'}</div><div class="val">${ex.toFixed(ex<10?2:0)} <span class="unit">${U_BASE}</span></div></div>
      <div class="pcx-pbox"><div class="lbl">${U_MID==='c'?'Chaos':'Exalted'}</div><div class="val">${toC(ex).toFixed(toC(ex)<10?2:0)} <span class="unit">${U_MID}</span></div></div>
    </div>
    <div class="pcx-grid">
      <div class="pcx-chart-card">
        <div class="pcx-section-h">История цены (div) · poe2scout</div>
        <div class="pcx-chart-wrap"><canvas id="pcx-canvas"></canvas></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:13px">
        <div class="pcx-info-card">
          <div class="pcx-section-h">Аналитика и рекомендация</div>
          ${a.reasons.map(r => `<div class="pc-reason">${r}</div>`).join('') || '<div class="pc-reason" style="color:var(--faint)">Недостаточно истории для сигналов.</div>'}
          <div class="pc-reason" style="color:var(--faint);margin-top:5px">Оценка по 3-дневной динамике poe2scout; патчи, анонсы и конец лиги не учитываются.</div>
        </div>
        ${pcxDescribe(it)}
      </div>
    </div>
  </div>`;
  drawPcxChart(it);
}

function drawPcxChart(it) {
  const canvas = document.getElementById('pcx-canvas');
  if (!canvas) return;
  if (pcxChart) { try { pcxChart.destroy(); } catch(e){} pcxChart = null; }
  // PriceLogs новые→старые, могут быть null; разворачиваем в хронологию и переводим в div
  const logs = (it.PriceLogs || []).filter(l => l && typeof l.Price === 'number' && l.Price > 0).slice().reverse();
  const labels = logs.map(l => { const d = new Date(l.Time); return isNaN(d) ? '' : (d.getDate()+'.'+(d.getMonth()+1)); });
  const data = logs.map(l => +(l.Price / divinePrice).toFixed(3));
  if (!data.length) { canvas.parentElement.innerHTML = '<div class="no-data">Нет истории цены</div>'; return; }
  if (!window.Chart) {
    // fallback: простой SVG-спарклайн, если CDN Chart.js недоступен
    const w = 320, h = 200, pad = 6;
    const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
    const pts = data.map((v,i) => `${pad + i*(w-2*pad)/(Math.max(1,data.length-1))},${h-pad-(v-mn)/rng*(h-2*pad)}`).join(' ');
    canvas.parentElement.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;color:var(--uniq)"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div class="pcx-prop" style="text-align:center">${mn.toFixed(2)}–${mx.toFixed(2)} div</div>`;
    return;
  }
  pcxChart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{
      label: 'div', data,
      borderColor: cssVar('--uniq'), backgroundColor: cssVar('--uniq') + '1a',
      borderWidth: 2, fill: true, tension: .25,
      pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: cssVar('--uniq'),
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => `${c.parsed.y} div · ${(c.parsed.y*divinePrice).toFixed(0)} ${U_BASE}` } } },
      scales: {
        y: { ticks: { font: { size: 10 }, color: cssVar('--faint'), callback: v => v + ' div' }, grid: { color: cssVar('--line-soft') }, border: { display: false } },
        x: { ticks: { font: { size: 10 }, color: cssVar('--faint'), maxRotation: 0, autoSkip: true }, grid: { display: false } },
      },
    },
  });
}

/* ── Data layer ──
   Реалм в пути: api.poe2scout.com/{REALM}/Leagues/{league}/...
   REALM='poe2' (Exalted-база) или 'pc' = PoE1 PC (Chaos-база).
   poe2 — можно через MCP (window.cowork); pc — только публичный API (MCP знает лишь poe2). */
const API_ROOT = 'https://api.poe2scout.com';
function apiBase() { return API_ROOT + '/' + REALM + '/Leagues/' + encodeURIComponent(LEAGUE); }

/* Список лиг: точный путь у нового API менялся — пробуем кандидатов по очереди.
   Если ни один не ответил, работаем на сохранённой лиге (селектор просто не заполнится). */
async function fetchLeagues(realm) {
  if (leaguesCache[realm]) return leaguesCache[realm];
  const candidates = [
    API_ROOT + '/' + realm + '/Leagues',
    API_ROOT + '/' + realm + '/leagues',
    API_ROOT + '/leagues?realm=' + realm,
    API_ROOT + '/Leagues?realm=' + realm,
  ];
  for (const u of candidates) {
    const d = await fetchJsonCors(u);
    const arr = Array.isArray(d) ? d : (Array.isArray(d?.Leagues) ? d.Leagues : (Array.isArray(d?.Items) ? d.Items : []));
    if (arr.length) { leaguesCache[realm] = arr; return arr; }
  }
  console.warn('leagues list unavailable, using stored league:', LEAGUE);
  return [];
}

async function fetchCategoriesResp() {
  const d = await fetchJsonCors(apiBase() + '/Items/Categories');
  return d || { CurrencyCategories: [], UniqueCategories: [] };
}

async function fetchCategory(cat) {
  if (REALM === 'poe2' && window.cowork?.callMcpTool) {
    try {
      const r = await window.cowork.callMcpTool('mcp__poe2scout-mcp__get_currency_items', { category: cat, league: LEAGUE, limit: 100 });
      if (r && !r.isError) {
        const d = r.structuredContent ?? (r.content?.[0] ? JSON.parse(r.content[0].text) : []);
        if (Array.isArray(d) && d.length) return d;
      }
    } catch {}
  }
  const url = `${apiBase()}/Currencies/ByCategory?Category=${encodeURIComponent(cat)}&Page=1&PerPage=250`;
  const d = await fetchJsonCors(url);
  return Array.isArray(d?.Items) ? d.Items : [];
}

// Уникальные предметы по категории (формат Items идентичен валюте + ItemMetadata)
async function fetchUniqueCategory(cat) {
  if (REALM === 'poe2' && window.cowork?.callMcpTool) {
    try {
      const r = await window.cowork.callMcpTool('mcp__poe2scout-mcp__get_unique_items', { category: cat, league: LEAGUE, limit: 100 });
      if (r && !r.isError) {
        const d = r.structuredContent ?? (r.content?.[0] ? JSON.parse(r.content[0].text) : []);
        if (Array.isArray(d) && d.length) return d;
      }
    } catch {}
  }
  const url = `${apiBase()}/Uniques/ByCategory?Category=${encodeURIComponent(cat)}&Page=1&PerPage=100`;
  const d = await fetchJsonCors(url);
  return Array.isArray(d?.Items) ? d.Items : [];
}

/* ── CORS ──
   api.poe2scout.com НЕ отдаёт Access-Control-Allow-Origin, поэтому напрямую из браузера
   с github.io данные получить нельзя — обязателен прокси.
   corsproxy.io с 2026 требует ключ (401), allorigins нестабилен, поэтому цепочка из нескольких.

   Свой прокси (надёжнее всего, Cloudflare Worker) задаётся один раз в консоли:
     localStorage.setItem('poe2_proxy', 'https://твой-worker.workers.dev/?url=')
   Он будет использоваться первым. */
const USER_PROXY = localStorage.getItem('poe2_proxy') || '';

function proxyChain(url) {
  const enc = encodeURIComponent(url);
  const list = [];
  if (USER_PROXY) list.push(USER_PROXY.includes('=') ? USER_PROXY + enc : USER_PROXY + '?url=' + enc);
  list.push('https://api.codetabs.com/v1/proxy?quest=' + enc);
  list.push('https://api.allorigins.win/raw?url=' + enc);
  list.push('https://api.allorigins.win/get?url=' + enc);   // обёртка {contents:"..."}
  list.push(url);                                           // напрямую — вдруг вернут CORS
  return list;
}

async function fetchWithTimeout(u, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(u, { signal: ctrl.signal, cache: 'no-store' }); }
  finally { clearTimeout(t); }
}

// Бесплатные прокси режут частоту — не долбим один и тот же мгновенно
const sleep = ms => new Promise(r => setTimeout(r, ms));

const jsonCache = new Map();
async function fetchJsonCors(url, { retries = 1 } = {}) {
  if (jsonCache.has(url)) return jsonCache.get(url);
  for (let attempt = 0; attempt <= retries; attempt++) {
    for (const u of proxyChain(url)) {
      try {
        const r = await fetchWithTimeout(u, 20000);
        if (!r.ok) {
          if (r.status === 429) await sleep(1500);   // rate limit прокси
          continue;
        }
        const txt = await r.text();
        if (!txt || txt[0] === '<') continue;        // прилетел HTML вместо JSON
        let d = JSON.parse(txt);
        if (d && typeof d.contents === 'string') d = JSON.parse(d.contents); // allorigins/get
        if (d) { jsonCache.set(url, d); return d; }
      } catch (e) { console.warn('fetch fail:', u.slice(0, 70), e.message); }
    }
    if (attempt < retries) await sleep(1200);
  }
  return null;
}

// Параллелим запросы, но не больше n одновременно — иначе прокси отдаёт 429
async function mapLimit(arr, n, fn) {
  const out = new Array(arr.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, arr.length) }, async () => {
    while (i < arr.length) { const k = i++; out[k] = await fn(arr[k], k); }
  }));
  return out;
}

/* ── Локальный кэш data.json ──
   Лежит в этом же репозитории и обновляется раз в час через GitHub Actions
   (workflow .github/workflows/update-data.yml, скрипт scripts/fetch-snapshot.mjs).
   Читается с того же домена github.io, поэтому CORS тут не участвует —
   это подстраховка на случай, когда живой API или все прокси недоступны. */
let snapshotFileCache = null;
async function loadSnapshotData(realm, league) {
  try {
    if (!snapshotFileCache) {
      const r = await fetch('./data.json', { cache: 'no-store' });
      if (!r.ok) return null;
      snapshotFileCache = await r.json();
    }
    const snaps = snapshotFileCache?.snapshots || {};
    let key = realm + '|' + league;
    let snap = snaps[key];
    if (!snap) {
      // нужной лиги нет в кэше (сменилась/название другое) — берём другую закэшированную
      // лигу этого реалма; если их несколько (SC+HC), по умолчанию предпочитаем SC
      const keys = Object.keys(snaps).filter(k => k.startsWith(realm + '|'));
      key = keys.find(k => !/^(HC|Hardcore) /i.test(k.slice(realm.length + 1))) || keys[0];
      snap = key ? snaps[key] : null;
    }
    if (!snap) return null;
    return { snap, league: key.slice(realm.length + 1) };
  } catch (e) { console.warn('data.json fallback fail:', e.message); return null; }
}
