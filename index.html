/* ── loadAll ──
   1) Сразу рисуем то, что есть в data.json — это тот же домен (github.io), без единого
      внешнего запроса, поэтому работает даже там, где api.poe2scout.com и Cloudflare-воркер
      недоступны без VPN (актуально для РФ).
   2) Пробуем живые данные поверх — если получилось, тихо перерисовываем экран актуальными
      числами (кэш при этом молча заменяется, баннер «показан кэш» пропадает).
   Если не удалось ни то ни другое — показываем ошибку. Если удался хотя бы кэш — экран
   остаётся рабочим, даже если живой шаг упал (ошибка живого шага просто уходит в консоль). */
async function loadAll() {
  const requestedLeague = LEAGUE; // то, что выбрал пользователь / что сохранено — кэш не должен это перетирать
  const cached = await loadSnapshotData(REALM, requestedLeague);
  let shown = false;
  if (cached) {
    try {
      LEAGUE = cached.league; // временно — чтобы selectbox ниже подсветил правильный option
      // мгновенно, без сети: список лиг реалма из того же кэша (может быть SC+HC сразу)
      const cachedNames = Object.keys(snapshotFileCache?.snapshots || {})
        .filter(k => k.startsWith(REALM + '|'))
        .map(v => ({ Value: v.slice(REALM.length + 1), IsCurrent: true }));
      fillGameLeagueSel(cachedNames);
      renderMarket(
        cached.snap.cats?.length ? cached.snap.cats : ['currency'],
        cached.snap.uniqCats || [],
        cached.snap.byCategory || {},
        (cached.snap.uniques || []).filter(u => u && u.CurrentPrice > 0),
        cached.league, cached.snap.categoriesResp, cached.snap.savedAt,
      );
      shown = true;
    } catch (e) { console.warn('loadAll: кэш не отрисовался:', e.message); }
  }
  // renderMarket выше мог временно выставить LEAGUE = cached.league (лига из кэша, если она
  // отличается от выбранной — например кэш ещё не обновился под новую лигу). Возвращаем
  // выбор пользователя, иначе следующий шаг (живые данные) молча уедет в лигу из кэша.
  LEAGUE = requestedLeague;

  try {
    const leagues = await fetchLeagues(REALM);
    // если выбранной лиги нет среди живых (сменилась/название другое) — берём текущую
    if (leagues.length && !leagues.some(l => l.Value === LEAGUE)) {
      const cur = leagues.find(l => l.IsCurrent && !/^HC /i.test(l.Value)) || leagues.find(l => l.IsCurrent) || leagues[0];
      if (cur) { LEAGUE = cur.Value; localStorage.setItem('poe2_league_' + REALM, LEAGUE); }
    }
    fillGameLeagueSel(leagues);
    const categoriesResp = await fetchCategoriesResp();
    buildCategories(categoriesResp); // временно — узнать CURRENCY_CATS/UNIQUE_CATS для живого фетча
    const cats = CURRENCY_CATS.length ? CURRENCY_CATS : [];
    const uniqCats = Object.keys(UNIQUE_CATS);
    if (!cats.length) throw new Error('категории не пришли');

    // через публичный прокси нельзя слать всё разом — лимит 3 одновременных запроса
    const results     = await mapLimit(cats, 3, cat => fetchCategory(cat));
    const uniqResults  = await mapLimit(uniqCats, 3, cat => fetchUniqueCategory(cat));
    const byCategory = {};
    cats.forEach((cat, i) => { byCategory[cat] = results[i]; });
    const liveUniques = [];
    uniqCats.forEach((cat, i) => {
      (uniqResults[i] || []).forEach(u => {
        if (!u || !(u.CurrentPrice > 0)) return;
        u.CategoryApiId = u.CategoryApiId || cat;
        liveUniques.push(u);
      });
    });

    const allCurrency = cats.flatMap(c => byCategory[c] || []);
    if (!allCurrency.length) throw new Error('живые цены пустые');

    renderMarket(cats, uniqCats, byCategory, liveUniques, LEAGUE, categoriesResp, null);
    shown = true;
  } catch (e) {
    console.warn('loadAll: живые данные недоступны' + (shown ? ' — оставляю кэш на экране' : '') + ':', e.message);
  }

  if (!shown) {
    document.getElementById('root').innerHTML = `<div class="error-msg">
      Не удалось загрузить данные с poe2scout — ни живьём, ни из локального кэша data.json
      (он либо ещё не создан GitHub Action'ом, либо пуст).<br><br>
      Попробуй «↺ Обновить» через минуту. Если живые данные нужны прямо сейчас, а не из
      часового кэша — подключи свой прокси в консоли:<br>
      <code style="display:inline-block;margin-top:5px;font-size:11px">localStorage.setItem('poe2_proxy','https://твой-worker.workers.dev/?url=')</code>
      </div>`;
  }
}

            <p style="margin-top:10px"><b>📦 Долгосрочные вложения.</b> Предметы в устойчивом росте: 3-дневный тренд × консистентность роста × ликвидность, с бонусом за ускорение. «Цель +3д» — линейная экстраполяция дневного прироста, ограничена +50% (параболы не экстраполируются честно). Вкладки категорий есть у обеих таблиц.</p>

            <p style="margin-top:10px"><b>⚗️ Крафт арбитраж.</b> Рецепты, где собрать дешевле, чем купить готовое: Origin Core (Cradle + Spark), Simulacrum и Breachstone из 300 сплинтеров, Perfect Runes (Greater + Masterwork + Orb of Extraction — цена Greater берётся с трейда вручную). Учитывай голд-комиссию биржи и время сборки.</p>

            <p style="margin-top:10px"><b>📒 Журнал сделок.</b> Ручной лог покупок/продаж с автоподстановкой названия. Цена за штуку в любой валюте — курс фиксируется в момент записи. P&L: реализованный считается от средней цены закупки, нереализованный — по живой рыночной цене открытого остатка. ⚠ у строки — продано больше, чем куплено (часть выручки без базы).</p>

            <p style="margin-top:10px"><b>🔎 Price Check (вкладка).</b> Начни вводить любую часть названия — поле ищет по подстроке среди <b>всех</b> предметов: валюта, расходники и уникалы. Выбери из подсказок — покажет курс сразу в div · ex · c, описание (для уникалов — база, iLvl, моды, флейвор; для валюты — эффект и стак), график истории цены и аналитику с рекомендацией и обоснованием. Аналитика — та же формула, что в Stash, работает автономно без внешнего AI. Кнопка «📊 разбор» в разделе уникалов открывает этот же экран на нужном предмете.</p>

            <p style="margin-top:10px"><b>⭐ Уникальные предметы.</b> Топ-20 по цене в каждой категории (оружие, броня, аксессуары, самоцветы, фласки, карты, Sanctum). Цена в exalted/divine. Бейдж ликвидности (/д) важен: у дешёвых junk-уникалов часто 1–3 листинга с тролльной ценой — такой цене верить нельзя. Зелёный = ликвидно, красный = единичные листинги.</p>

            <p style="margin-top:10px"><b>📦 Stash (вкладка, бывш. Price Check).</b> Быстрая оценка из игры: наведи курсор на предмет, нажми Ctrl+C, кликни в поле и Ctrl+V — оценка запустится сама (кнопка «Из буфера» работает, если браузер разрешает чтение буфера). Распознаются название и Stack Size. Ответ: цена за штуку и за стак в ex/div/chaos и вердикт от «продавать сейчас» до «держать». Здесь же список сохранённых позиций.</p>

            <p style="margin-top:6px"><b>Как строится рекомендация.</b> Сумма пяти сигналов: 3д-тренд (рост +10..35% — за держать; перегрев &gt;+35% и падение &lt;−10% — за продажу), движение за 24ч (просадка &gt;3% после роста — окно фиксации, это и есть сигнал разворота при таком коротком окне оценки), позиция в 3-дневном диапазоне (у максимума — выгодно продать, у дна без падения — невыгодно), динамика предложения (объём упал за 3д — дефицит держит цену, вырос — давит) и ликвидность (меньше 20 сделок/день — продажа затянется). Каждый сигнал виден в обосновании. Оценка чисто статистическая: патчи, анонсы и конец лиги она не знает.</p>

            <p style="margin-top:10px"><b>📦 Stash.</b> После вставки предмета из буфера (Ctrl+V) он добавляется в Stash автоматически; кнопка «↻ Обновить кол-во в Stash» обновляет количество для того же предмета. Цены и рекомендации пересчитываются живыми при каждом обновлении; Δ — изменение к цене на момент добавления. Повторное добавление того же предмета обновляет количество (база для Δ сохраняется). Клик по названию раскрывает обоснование, наведение — показывает его в подсказке. Сортировка кликом по заголовку: цены и Δ — сначала по убыванию, рекомендация — по срочности продажи. Продал — убери строку ✕.</p>

            <p style="margin-top:10px"><b>Ограничения.</b> История — дневные свечи, внутридневные движения не видны. Биржа берёт комиссию голдом — в расчётах её нет. Цены маленьких предметов в div округляются крупными шагами — для них котируй в ex. Все «ожидаемые прибыли» — оценки по историческим ценам, не гарантия.</p>
          </div></div>
        </div>
      </div>
      <div id="tab-price" style="display:${mainTab==='price'?'':'none'}">
        <div class="content">
          <div class="card">
            <div class="card-header coll" style="background:var(--pc-bg);color:var(--pc)" onclick="toggleSec('pc')">${chev('pc')}📋 Оценка из буфера <span class="badge" style="background:var(--pc);color:var(--on-accent);margin-left:auto">Ctrl+C → авто-Stash</span></div>
            <div id="sec-pc" style="${secStyle('pc')}">
            <div class="pc-form">
              <textarea id="pc-input" onpaste="setTimeout(pcEvaluate, 60)" placeholder="Кликни сюда и нажми Ctrl+V — оценка запустится сама&#10;&#10;Item Class: Stackable Currency&#10;Rarity: Currency&#10;Greater Chaos Orb&#10;--------&#10;Stack Size: 18/20&#10;..."></textarea>
              <div style="display:flex;flex-direction:column;gap:6px">
                <button class="tr-btn" style="background:var(--pc)" onclick="pcPaste()">📋 Из буфера</button>
              </div>
            </div>
            <div id="pc-result"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header coll" style="background:var(--flip-bg);color:var(--flip)" onclick="toggleSec('stash')">${chev('stash')}📦 Stash <span class="badge" style="background:var(--flip);color:var(--on-accent);margin-left:auto" id="stash-count"></span></div>
            <div id="sec-stash" style="${secStyle('stash')}"><div id="pc-stash"></div></div>
          </div>
        </div>
      </div>
      <div id="tab-pricecheck" style="display:${mainTab==='pricecheck'?'':'none'}">
        <div class="content">
          <div class="card">
            <div class="card-header" style="background:var(--uniq-bg);color:var(--uniq)">🔎 Price Check <span class="badge" style="background:var(--uniq);color:var(--on-accent);margin-left:auto">курс · история · аналитика</span></div>
            <div class="pcx-form">
              <label>Предмет:</label>
              <input id="pcx-input" list="pcx-dl" class="pcx-select" autocomplete="off" placeholder="начни вводить любую часть названия — валюта, расходники, уникалы…" oninput="pcxInput()" onchange="pcxInput()">
              <datalist id="pcx-dl"></datalist>
              <button class="cur-btn" onclick="var i=document.getElementById('pcx-input');i.value='';i.focus();pcxSelect('')">сброс</button>
            </div>
            <div id="pcx-result"><div class="no-data">Выбери предмет из списка — покажу курс (div и базовая валюта игры), историю цены и аналитику с рекомендацией</div></div>
          </div>
        </div>
      </div>
      <div id="tab-market" style="display:${mainTab==='market'?'':'none'}">
      <div class="content">
        <div class="card">
          <div class="card-header rates coll" onclick="toggleSec('rates')">${chev('rates')}💰 Курсы валют <span class="badge badge-rates">div · ${U_BASE} · ${U_MID}</span></div>
          <div id="sec-rates" style="${secStyle('rates')}"><div class="rates-grid">${renderRates(currency)}</div></div>
        </div>
        <div class="portfolio-block">
          <div class="card-header coll" onclick="toggleSec('portfolio')">${chev('portfolio')}💼 Рекомендованный портфель <span class="badge" style="background:var(--gold);color:var(--on-accent);margin-left:auto">AI</span></div>
          <div id="sec-portfolio" style="${secStyle('portfolio')}"><div id="portfolio-content"></div></div>
        </div>
        <div class="tracker-block">
          <div class="card-header coll" onclick="toggleSec('tracker')">${chev('tracker')}📒 Журнал сделок <span class="badge" style="background:var(--craft);color:var(--on-accent);margin-left:auto">P&L</span></div>
          <div id="sec-tracker" style="${secStyle('tracker')}"><div id="tracker-content"></div></div>
          <datalist id="items-dl">${Object.keys(marketByText).sort().map(n => `<option value="${n.replace(/"/g,'&quot;')}">`).join('')}</datalist>
        </div>
        <div class="cards-row">
          <div class="card">
            <div class="card-header flip coll" onclick="toggleSec('flip')">${chev('flip')}🔄 Топ флип <span class="badge badge-flip">10</span></div>
            <div id="sec-flip" style="${secStyle('flip')}">
              <div class="cat-tabs" id="flip-tabs">${catTabsHtml('flip', flipCat)}</div>
              <div id="flip-content"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header invest coll" onclick="toggleSec('invest')">${chev('invest')}📦 Долгосрочные вложения <span class="badge badge-invest">10</span></div>
            <div id="sec-invest" style="${secStyle('invest')}">
              <div class="cat-tabs" id="invest-tabs">${catTabsHtml('invest', investCat)}</div>
              <div id="invest-content"></div>
            </div>
          </div>
        </div>
        ${REALM === 'poe2' ? renderCraftBlock(runesItems, fragmentsItems, incursionItems) : ''}
        ${uniqCats.length ? `<div class="card uniq-block">
          <div class="card-header coll" onclick="toggleSec('uniq')">${chev('uniq')}⭐ Уникальные предметы <span class="badge" style="background:var(--uniq);color:var(--on-accent);margin-left:auto">${allUniques.length}</span></div>
          <div id="sec-uniq" style="${secStyle('uniq')}">
            <div class="craft-note">Топ-20 по цене в категории. Цена в base-валюте; маленькая ликвидность = ненадёжная цена (часто 1–3 тролльных листинга). «📊 разбор» открывает Price Check.</div>
            <div class="cat-tabs" id="uniq-tabs">${uniqTabsHtml()}</div>
            <div id="uniq-content"></div>
          </div>
        </div>` : ''}
      </div>
      </div>`;

    renderTables();
    renderPortfolio();
    renderTracker();
    renderStash();
    renderUniques();
    fillPcxList(pcxCurrent ? pcxCurrent.Text : '');

  } catch(e) {
    document.getElementById('root').innerHTML = `<div class="error-msg">Ошибка: ${e.message}</div>`;
  }
}

refreshProfileSel();
loadAll();
</script>
