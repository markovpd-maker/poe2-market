name: Update market data.json

on:
  schedule:
    # Раз в час по расписанию GitHub долетает ненадёжно (сам GitHub предупреждает, что
    # schedule-триггер может задерживаться/пропускаться в пиковые моменты — типично
    # долетает 30-60% часовых запусков). Поэтому пробуем каждые 20 минут: лишние прогоны
    # ничего не стоят (коммит идёт только если data.json реально изменился), а шанс, что
    # хотя бы один прогон в течение часа долетит и отработает, — намного выше.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}   # кнопка "Run workflow" вручную, для проверки без ожидания

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Снять свежие данные с poe2scout
        run: node scripts/fetch-snapshot.mjs

      - name: Закоммитить data.json, если что-то изменилось
        run: |
          git config user.name "poe2-market-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "data.json не изменился, коммит не нужен."
          else
            git add data.json
            git commit -m "chore: обновление рыночных данных ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
